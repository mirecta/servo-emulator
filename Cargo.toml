[package]
name = "servo_emulator"
version = "0.1.0"
edition = "2021"
authors = ["mirecta"]
description = "ESP32-S3 (esp-idf) app: measure two RC servo pulse widths and display two gauges on an SSD1306-compatible OLED"
license = "MIT"
publish = false

# Binary entry
[[bin]]
name = "servo-emulator"
path = "src/main.rs"

# Notes:
# - This manifest targets an ESP32-S3 board running ESP-IDF via the `esp-idf-sys` crate.
# - Ensure your local ESP-IDF installation matches the version expected by `esp-idf-sys`.
# - Default wiring expectations (change in source if you wire differently):
#     I2C SDA = GPIO21, SCL = GPIO20
#     Servo inputs = GPIO4 and GPIO5
# - If you want a no-std / esp-hal implementation instead, switch to `esp32s3-hal` and adjust code.

[dependencies]
# ESP-IDF bindings and HAL for esp-idf-based workflow.
# Keep versions aligned with your local ESP-IDF installation.
esp-idf-sys = "0.36"
esp-idf-hal = "0.45"
esp-idf-svc = { version = "0.51", features = ["binstart"] }

# Display stack (raw I2C for SH1107)
embedded-graphics = "0.8"

# Embedded ecosystem
heapless = "0.8"

[build-dependencies]
embuild = "0.33"

[features]
default = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false

# Helpful reminders for build environment
# - Install and export ESP-IDF per the esp-idf-sys documentation.
# - Use the esp-idf-compatible Rust toolchain (for S3 the standard Rust toolchain is fine;
#   esp-idf-sys will link against the native ESP-IDF libraries).
# - Typical build flow:
#     $ source /path/to/esp-idf/export.sh
#     $ cargo build --release
#   Or use cargo-espflash/cargo-embed as preferred for flashing.
